name: Docker Build and Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '需要补发镜像的现有版本标签，例如 v2.0.7'
        type: string
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ghcr-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      image: ${{ steps.source.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - name: 核对标签与源码版本
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${RELEASE_TAG#v}"
          SOURCE_VERSION="$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' backend/Cargo.toml)"
          test "$SOURCE_VERSION" = "$VERSION"
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
    permissions:
      contents: read

  docker:
    needs: [prepare, quality]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: docker/setup-buildx-action@v3
      - name: 登录本仓库 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送架构摘要
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}
      - name: 检查容器启动与媒体工具
        timeout-minutes: 3
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /app/ting-reader "$IMAGE@$DIGEST" --help
          docker run -d --name ting-reader-smoke -p 127.0.0.1::3000 "$IMAGE@$DIGEST"
          trap 'docker rm -f ting-reader-smoke >/dev/null 2>&1 || true' EXIT
          HOST_PORT=$(docker port ting-reader-smoke 3000/tcp | awk -F: 'NR==1 {print $NF}')
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 "http://127.0.0.1:$HOST_PORT/api/health" > health.json; then
              if python3 -c 'import json,os; h=json.load(open("health.json")); assert h["status"] == "healthy" and h["version"] == os.environ["VERSION"]'; then
                docker exec ting-reader-smoke /app/bin/ffmpeg -hide_banner -encoders | grep libmp3lame
                docker exec ting-reader-smoke /app/bin/ffprobe -version
                exit 0
              fi
            fi
            sleep 2
          done
          docker logs ting-reader-smoke
          exit 1
      - name: 保存镜像摘要
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ghcr-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 合并架构并创建新的版本标签
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2> inspect-error.txt; then
            echo "::error::版本镜像已存在，禁止覆盖；请发布新版本、新标签。"
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|name unknown' inspect-error.txt; then
            cat inspect-error.txt
            exit 1
          fi
          shopt -s nullglob
          DIGESTS=("$RUNNER_TEMP/digests/"*)
          test "${#DIGESTS[@]}" -eq 2
          REFERENCES=()
          for entry in "${DIGESTS[@]}"; do
            digest="${entry##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            REFERENCES+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$SOURCE_SHA" \
            "${REFERENCES[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > manifest.json
          python3 - <<'PY'
          import json
          import os
          manifest = json.load(open('manifest.json'))
          platforms = {(item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
                       for item in manifest['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms
          assert manifest['annotations']['org.opencontainers.image.revision'] == os.environ['SOURCE_SHA']
          PY
      - name: 更新 latest 且不回退已有版本
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:latest" --raw > latest.json 2> latest-error.txt; then
            PREVIOUS=$(python3 -c 'import json; print(json.load(open("latest.json")).get("annotations", {}).get("org.opencontainers.image.version", ""))')
            if [[ ! "$PREVIOUS" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "无法确认现有 latest 版本，保留其指向；新版本镜像已发布。"
              exit 0
            fi
            NEWEST=$(printf '%s\n' "$PREVIOUS" "$VERSION" | sort -V | tail -n 1)
            if [ "$NEWEST" != "$VERSION" ]; then
              echo "补发旧版本，不回退 latest。"
              exit 0
            fi
          elif ! grep -Eqi 'not found|manifest unknown|name unknown' latest-error.txt; then
            cat latest-error.txt
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
      - name: 输出镜像使用说明
        run: |
          {
            echo "镜像：\`$IMAGE:$VERSION\`，支持 linux/amd64 和 linux/arm64。"
            echo
            echo "\`docker pull $IMAGE:$VERSION\`"
            echo
            echo "首次发布后，请在 https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/ting-reader/settings 将镜像可见性设为 Public，之后即可免登录拉取。"
          } >> "$GITHUB_STEP_SUMMARY"
